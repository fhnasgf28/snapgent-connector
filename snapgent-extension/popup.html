<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snapgent Connector</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #18181b;
      --surface-hover: #222226;
      --border: #27272a;
      --border-strong: #3f3f46;
      --text-main: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #fafafa;
      --ok: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
      --radius: 6px;
      --radius-sm: 4px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 356px;
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border-top: 2px solid var(--text-main);
    }

    /* ── Header ────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-sm);
      background: var(--text-main);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .version-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      letter-spacing: -0.02em;
    }

    /* ── Status Panel ──────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      position: relative;
      flex-shrink: 0;
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.14);
    }

    .dot.warn {
      background: var(--warn);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.14);
    }

    .dot.bad {
      background: var(--bad);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.14);
    }

    #state {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    #tools {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .bridge-endpoint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-secondary);
      padding: 6px 8px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .bridge-endpoint .ep-label {
      color: var(--text-muted);
      margin-right: 4px;
    }

    .bridge-endpoint span.active {
      color: var(--ok);
      font-weight: 500;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Runtime Modules */
    .tags-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .tag-chip {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      padding: 4px 6px;
      border-radius: var(--radius-sm);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #servers {
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.55;
      color: var(--text-secondary);
      white-space: pre-line;
    }
    #servers:empty { display: none; }

    /* ── Quick Jump to Web AI ──────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .ai-links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .ai-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
      text-decoration: none;
    }

    .ai-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text-main);
    }

    .ai-btn-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
    }

    .ai-btn svg {
      width: 10px;
      height: 10px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      opacity: 0.6;
    }

    .ai-btn:hover svg {
      opacity: 1;
    }

    /* ── Main Actions ──────────────────────────────────────── */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    button.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    button.btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      flex-shrink: 0;
    }

    button.btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    button.btn:active {
      background: var(--surface-elevated);
    }

    button.btn-primary {
      background: var(--text-main);
      border-color: var(--text-main);
      color: var(--bg);
      font-weight: 600;
    }

    button.btn-primary:hover {
      background: #e4e4e7;
      border-color: #e4e4e7;
    }

    button.btn-full {
      grid-column: 1 / -1;
    }

    /* ── Footer ────────────────────────────────────────────── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-muted);
    }

    .cmd-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </div>
        <span class="brand-title">Snapgent Bridge</span>
      </div>
      <span class="version-tag">v3.2 · MCP</span>
    </header>

    <!-- Status Card -->
    <section class="card">
      <div class="status-row">
        <div class="status-badge">
          <span id="dot" class="dot"></span>
          <span id="state">Connecting...</span>
        </div>
        <span id="tools">-- tools</span>
      </div>

      <div class="bridge-endpoint">
        <span><span class="ep-label">HOST</span>ws://127.0.0.1:17613</span>
        <span class="active">ONLINE</span>
      </div>

      <!-- Runtime Modules -->
      <div class="tags-row">
        <span class="tag-chip">vscode</span>
        <span class="tag-chip">openclaw</span>
        <span class="tag-chip">agy-cli</span>
        <span class="tag-chip">hermes</span>
      </div>

      <div id="servers"></div>
    </section>

    <!-- Quick AI Jump -->
    <div>
      <div class="section-header">
        <span class="section-title">Target Web Sessions</span>
      </div>
      <div class="ai-links">
        <a class="ai-btn" id="ai-deepseek" href="https://chat.deepseek.com/" target="_blank">
          <div class="ai-btn-top"><span>01</span><svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg></div>
          <span>DeepSeek</span>
        </a>
        <a class="ai-btn" id="ai-claude" href="https://claude.ai/" target="_blank">
          <div class="ai-btn-top"><span>02</span><svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg></div>
          <span>Claude</span>
        </a>
        <a class="ai-btn" id="ai-chatgpt" href="https://chatgpt.com/" target="_blank">
          <div class="ai-btn-top"><span>03</span><svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg></div>
          <span>ChatGPT</span>
        </a>
        <a class="ai-btn" id="ai-gemini" href="https://gemini.google.com/" target="_blank">
          <div class="ai-btn-top"><span>04</span><svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg></div>
          <span>Gemini</span>
        </a>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-grid">
      <button class="btn btn-primary" id="reconnect">
        <svg viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        <span>Reconnect</span>
      </button>
      <button class="btn" id="restart">
        <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        <span>Restart MCP</span>
      </button>
      <button class="btn btn-full" id="settings">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span>Workspace & Overlay Config</span>
      </button>
    </div>

    <!-- Footer -->
    <footer>
      <span>Daemon script</span>
      <div class="cmd-pill">./start.sh</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
